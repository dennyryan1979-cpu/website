<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/modernist-a1f0a1d5-6492-4405-916e-6ea81240b8cd/styles.css">
  <script src="_ds/modernist-a1f0a1d5-6492-4405-916e-6ea81240b8cd/_ds_bundle.js"></script>
  <script src="./image-slot.js"></script>
  <style>doc-page:not(:defined){visibility:hidden}</style>
  <script src="./doc-page.js"></script>
  <style>
    body { margin: 0; background: var(--color-neutral-200); }
    .page, .page * { box-sizing: border-box; }
  </style>
</helmet>

<div style="padding:24px 0;--color-accent:#002FA7;--color-accent-100:#dce4f5;--color-accent-600:#002791;--color-accent-700:#001f70;">
  <div style="width:1123px;margin:0 auto 20px;display:flex;justify-content:space-between;align-items:center;font-family:var(--font-body);">
    <div style="font-family:var(--font-heading);font-weight:700;font-size:16px;">Safer Injecting: Peptides — Storyboard</div>
    <button onClick="{{ addPanel }}" style="background:var(--color-accent);color:var(--color-bg);border:none;font-family:var(--font-heading);font-weight:700;font-size:13px;padding:10px 16px;cursor:pointer;">+ Add panel</button>
  </div>

  <doc-page size="a4" orientation="landscape">
    <sc-for list="{{ pages }}" as="pg" hint-placeholder-count="3">
      <section class="page" style="padding:36px;box-sizing:border-box;display:flex;flex-direction:column;font-family:var(--font-body);color:var(--color-text);background:var(--color-bg);height:100%;width:100%;overflow:hidden;">
        <div style="display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid var(--color-divider);padding-bottom:14px;margin-bottom:20px;flex:none;">
          <h1 style="font-family:var(--font-heading);font-weight:700;font-size:26px;margin:0;">Safer Injecting: Peptides</h1>
          <div style="font-size:13px;color:var(--color-neutral-700);">Page {{ pg.pageNum }} of {{ pg.pageCount }}</div>
        </div>
        <div style="flex:1;display:grid;grid-template-columns:repeat(3, minmax(0,1fr));grid-template-rows:repeat(2, minmax(0,1fr));gap:18px;min-height:0;overflow:hidden;">
          <sc-for list="{{ pg.items }}" as="p" hint-placeholder-count="6">
            <div style="display:flex;flex-direction:column;border:2px solid var(--color-divider);min-height:0;min-width:0;overflow:hidden;">
              <div style="display:flex;align-items:center;gap:8px;padding:6px 10px;border-bottom:2px solid var(--color-divider);background:var(--color-neutral-100);flex:none;">
                <div style="background:var(--color-accent);color:var(--color-bg);font-family:var(--font-heading);font-weight:700;font-size:12px;width:20px;height:20px;display:flex;align-items:center;justify-content:center;flex:none;">{{ p.num }}</div>
                <div style="font-family:var(--font-heading);font-weight:700;font-size:11px;letter-spacing:0.02em;flex:1;">{{ p.title }}</div>
                <sc-if value="{{ p.removable }}">
                  <button onClick="{{ p.remove }}" style="background:none;border:none;color:var(--color-accent-700);font-size:14px;cursor:pointer;line-height:1;padding:0;flex:none;">×</button>
                </sc-if>
              </div>
              <image-slot id="{{ p.slotId }}" shape="rect" fit="contain" style="width:100%;flex:1;min-height:0;" placeholder="{{ p.placeholder }}"></image-slot>
              <div style="padding:8px 10px;border-top:2px solid var(--color-divider);flex:none;">
                <p style="margin:0;font-size:12px;line-height:1.3;color:var(--color-text);">{{ p.caption }}</p>
              </div>
            </div>
          </sc-for>
        </div>
      </section>
    </sc-for>
  </doc-page>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { extra: [] };

  addPanel = () => {
    this.setState(s => ({ extra: [...s.extra, {
      title: "New Panel",
      placeholder: "Describe the scene for this panel.",
      caption: "Add caption text here."
    }] }));
  };

  removePanel = (idx) => {
    this.setState(s => ({ extra: s.extra.filter((_, i) => i !== idx) }));
  };

  renderVals() {
    const raw = [
      ["Title Visual", "Title card, clean medical/instructional background, watercolour sketch.", "Safer Injecting: Peptides -  Content warning"],
      ["Why It Matters", "Split watercolour sketch: clean injection site (left) vs. bruising/scar tissue (right), illustrative not graphic.", "Poor injecting practices can increase the risk of infections, abscesses, bruising and scar tissue."],
      ["Video Intro", "Presenter/narrator facing camera, calm instructional pose, watercolour sketch.", "This video walks through key principles of safer peptide injecting to reduce harm and lower risk of complications."],
      ["Gather Equipment", "Overhead flat-lay watercolour sketch: alcohol swabs, cotton balls/gauze, sterile syringe and needle, sterile peptide vial, bacteriostatic water, sharps container.", "Gather your equipment before you begin."],
      ["Wash Hands", "Watercolour sketch of hands washed thoroughly with soap and water at a sink; alcohol sanitiser shown as alternative.", "Always start by washing your hands thoroughly, or use an alcohol-based sanitiser."],
      ["Clean Work Surface", "Watercolour sketch of a hand wiping a clean, flat work surface with a disinfectant wipe.", "Clean your work surface to minimise contamination — one of the most important steps for reducing infection."],
      ["Reconstitution", "Watercolour sketch: vial of freeze-dried peptide powder beside bacteriostatic water; solution being drawn up, shown clear, not cloudy.", "Mix peptide powder with sterile bacteriostatic water. Check the solution is clear — never use one that's cloudy, discoloured, or has particles."],
      ["Worked Dosing Example", "Clean diagram/graphic overlay in watercolour style showing the math: 10mg peptide + 1mL water → 1mg/0.1mL → 0.2mL = 2mg = 20 IU on a 29g needle.", "Worked example: 10mg retatrutide + 1mL water = 1mg per 0.1mL. Inject 0.2mL for a 2mg dose — 20 IUs on a 29g needle."],
      ["Choose Injection Site", "Watercolour diagram of the lower abdomen highlighting subcutaneous injection zones a few centimetres from the belly button, arrows showing site rotation.", "Subcutaneous injection into the fatty tissue of the abdomen. Rotate sites each time to reduce irritation and scar tissue."],
      ["Clean the Skin", "Watercolour sketch of an alcohol swab wiping the chosen injection site, air-drying.", "Clean the skin with an alcohol swab and let it dry completely."],
      ["Prepare the Syringe", "Close-up watercolour sketch: syringe being filled, needle tip kept sterile, air bubbles tapped out and expelled.", "Use a new sterile syringe and needle. Avoid touching the needle. Remove any air bubbles before injecting."],
      ["Inject", "Watercolour sketch: hand pinching a fold of abdominal skin, needle inserted at correct angle, slow steady injection.", "Pinch a fold of skin, insert the needle into the fatty tissue, and inject slowly and steadily."],
      ["Dispose Safely", "Watercolour sketch: needle withdrawn smoothly, dropped directly into a labeled sharps container.", "Remove the needle smoothly and dispose of it immediately in an approved sharps container."],
      ["Aftercare", "Watercolour sketch: gentle pressure with gauze on injection site (no rubbing); calendar/clock icon suggesting days passing, magnifying glass on skin showing signs to watch for.", "Apply gentle pressure with clean gauze. Over the next few days, watch for redness, swelling, warmth, pain or discharge — signs of possible infection."],
      ["Closing Safety Reminders", "Watercolour sketch: crossed-out icon of a shared/reused needle; checklist icon with sterile equipment, site rotation, hygiene steps ticked off.", "Never reuse or share needles or syringes. Sterile equipment, site rotation, and good hygiene lower injecting-related harms."]
    ];
    const base = raw.map((r, i) => ({
      num: i + 1,
      title: r[0],
      placeholder: r[1],
      caption: r[2],
      slotId: "panel-" + (i + 1),
      removable: false
    }));
    const extra = this.state.extra.map((p, i) => ({
      num: base.length + i + 1,
      title: p.title,
      placeholder: p.placeholder,
      caption: p.caption,
      slotId: "panel-extra-" + i,
      removable: true,
      remove: () => this.removePanel(i)
    }));
    const panels = base.concat(extra);

    const perPage = 6;
    const chunks = [];
    for (let i = 0; i < panels.length; i += perPage) chunks.push(panels.slice(i, i + perPage));
    const pageCount = chunks.length;
    const pages = chunks.map((items, i) => ({ items, pageNum: i + 1, pageCount }));

    return { pages, addPanel: this.addPanel, removePanel: this.removePanel };
  }
}

</script>
</body>
</html>
