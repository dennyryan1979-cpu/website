<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>VJ // EFFECT RANDOMIZER</title>
<style>
  :root{
    --bg:#0d0d0b;
    --text:#e8e4dc;
    --accent:#c8b89a;
    --danger:#d4472a;
    --border:#2a2a26;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; }
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Courier New', Courier, monospace;
    display:flex;
    flex-direction:column;
    height:100vh;
    overflow:hidden;
    user-select:none;
  }
  #stage{
    position:relative;
    flex:1 1 auto;
    min-height:0;
    background:var(--bg);
    overflow:hidden;
  }
  #glcanvas{
    position:absolute;
    top:0; left:0;
    width:100%; height:100%;
    display:block;
  }

  /* Source drop zones */
  #sources{
    flex:0 0 auto;
    display:flex;
    gap:8px;
    padding:8px 12px;
    border-top:1px solid var(--border);
    background:var(--bg);
  }
  .source-slot{
    flex:1 1 0;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    height:36px;
    border:1px dashed var(--accent);
    font-size:11px;
    letter-spacing:2px;
    text-transform:uppercase;
    color:var(--accent);
    transition:background 0.15s, color 0.15s, border-color 0.15s;
    overflow:hidden;
    white-space:nowrap;
    padding:0 8px;
    cursor:default;
  }
  .source-slot.dragover{
    background:rgba(200,184,154,0.06);
    color:var(--text);
    border-color:var(--text);
  }
  .source-slot.loaded{
    border:1px solid var(--border);
    color:var(--text);
    justify-content:flex-start;
  }
  .source-num{
    color:var(--danger);
    font-weight:bold;
    flex:0 0 auto;
  }
  .source-label{
    overflow:hidden;
    text-overflow:ellipsis;
  }

  /* Mixer */
  #mixer{
    display:flex;
    flex-direction:column;
    gap:8px;
    padding-bottom:10px;
    border-bottom:1px solid var(--border);
  }
  .mixer-row{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .mixer-label{
    font-size:11px;
    letter-spacing:2px;
    text-transform:uppercase;
    color:var(--accent);
    min-width:60px;
  }
  .mixer-btn{
    background:var(--bg);
    color:var(--text);
    border:1px solid var(--border);
    font-family:inherit;
    font-size:11px;
    width:32px;
    height:28px;
    cursor:pointer;
  }
  .mixer-btn:hover{ border-color:var(--accent); color:var(--accent); }
  .mixer-btn.active{
    border-color:var(--danger);
    color:var(--danger);
  }
  .mixer-row input[type="range"]{
    flex:1 1 auto;
    -webkit-appearance:none;
    appearance:none;
    height:1px;
    background:var(--border);
    outline:none;
  }
  .mixer-row input[type="range"]::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:10px; height:10px;
    background:var(--accent);
    border-radius:0;
    cursor:pointer;
  }
  .mixer-row input[type="range"]::-moz-range-thumb{
    width:10px; height:10px;
    background:var(--accent);
    border:none;
    border-radius:0;
    cursor:pointer;
  }
  .mixer-row .val{
    font-size:11px;
    color:var(--accent);
    min-width:30px;
    text-align:right;
  }

  /* Toolbar */
  #toolbar{
    position:absolute;
    top:12px; right:12px;
    display:flex;
    gap:8px;
    z-index:5;
  }
  #toolbar button{
    background:var(--bg);
    color:var(--text);
    border:1px solid var(--border);
    font-family:inherit;
    font-size:11px;
    letter-spacing:2px;
    text-transform:uppercase;
    padding:8px 12px;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:6px;
  }
  #toolbar button:hover{
    border-color:var(--accent);
    color:var(--accent);
  }
  #recordBtn.active{
    border-color:var(--danger);
    color:var(--danger);
  }
  .rec-dot{
    width:8px; height:8px;
    border-radius:50%;
    background:var(--danger);
    display:inline-block;
    flex:0 0 auto;
    animation:blink 1s infinite;
  }
  @keyframes blink{
    0%,49%{ opacity:1; }
    50%,100%{ opacity:0.15; }
  }

  /* Badges */
  #badges{
    position:absolute;
    top:12px; left:12px;
    display:flex;
    flex-direction:column;
    gap:4px;
    z-index:5;
    pointer-events:none;
  }
  .badge{
    background:var(--danger);
    color:var(--bg);
    font-size:10px;
    letter-spacing:2px;
    text-transform:uppercase;
    padding:4px 8px;
    border-radius:2px;
    width:fit-content;
    font-weight:bold;
  }

  /* Controls panel */
  #controls{
    flex:0 0 auto;
    border-top:1px solid var(--border);
    background:var(--bg);
    display:flex;
    flex-direction:column;
  }
  #panelToggle{
    width:100%;
    background:var(--bg);
    color:var(--accent);
    border:none;
    border-bottom:1px solid var(--border);
    font-family:inherit;
    font-size:11px;
    letter-spacing:3px;
    text-transform:uppercase;
    padding:8px;
    cursor:pointer;
    text-align:center;
  }
  #panelToggle:hover{ color:var(--text); }
  #panelBody{
    padding:12px 16px;
    display:flex;
    flex-direction:column;
    gap:12px;
    max-height:40vh;
    overflow-y:auto;
  }
  #controls.collapsed #panelBody{ display:none; }

  #effectsList{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(220px, 1fr));
    gap:8px 20px;
  }
  .effect-row{
    display:flex;
    align-items:center;
    gap:10px;
    padding:6px 0;
    border-bottom:1px solid var(--border);
  }
  .effect-row label.toggle{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:11px;
    letter-spacing:2px;
    text-transform:uppercase;
    min-width:120px;
    cursor:pointer;
  }
  .effect-row input[type="checkbox"]{
    appearance:none;
    width:13px; height:13px;
    border:1px solid var(--border);
    background:var(--bg);
    cursor:pointer;
    position:relative;
    flex:0 0 auto;
  }
  .effect-row input[type="checkbox"]:checked{
    background:var(--danger);
    border-color:var(--danger);
  }
  .effect-row input[type="range"]{
    flex:1 1 auto;
    -webkit-appearance:none;
    appearance:none;
    height:1px;
    background:var(--border);
    outline:none;
  }
  .effect-row input[type="range"]::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:10px; height:10px;
    background:var(--accent);
    border-radius:0;
    cursor:pointer;
  }
  .effect-row input[type="range"]::-moz-range-thumb{
    width:10px; height:10px;
    background:var(--accent);
    border:none;
    border-radius:0;
    cursor:pointer;
  }
  .effect-row .val{
    font-size:11px;
    color:var(--accent);
    min-width:30px;
    text-align:right;
  }
  .effect-sub{
    grid-column:1 / -1;
    display:flex;
    align-items:center;
    gap:8px;
    padding:4px 0 8px 0;
    border-bottom:1px solid var(--border);
    margin-top:-4px;
  }
  .effect-sub .ch-label{
    font-size:10px;
    letter-spacing:2px;
    text-transform:uppercase;
    color:var(--accent);
    min-width:14px;
    flex:0 0 auto;
  }
  .effect-sub input[type="range"]{
    flex:1 1 auto;
    -webkit-appearance:none;
    appearance:none;
    height:1px;
    background:var(--border);
    outline:none;
  }
  .effect-sub input[type="range"]::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:10px; height:10px;
    background:var(--accent);
    border-radius:0;
    cursor:pointer;
  }
  .effect-sub input[type="range"]::-moz-range-thumb{
    width:10px; height:10px;
    background:var(--accent);
    border:none;
    border-radius:0;
    cursor:pointer;
  }
  .effect-sub .val{
    font-size:11px;
    color:var(--accent);
    min-width:26px;
    text-align:right;
    flex:0 0 auto;
  }
  .duo-swatch{
    width:18px; height:18px;
    border:1px solid var(--border);
    flex:0 0 auto;
  }

  #actions{
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
    padding-top:8px;
    border-top:1px solid var(--border);
  }
  #actions button, #actions select{
    background:var(--bg);
    color:var(--text);
    border:1px solid var(--border);
    font-family:inherit;
    font-size:11px;
    letter-spacing:2px;
    text-transform:uppercase;
    padding:8px 14px;
    cursor:pointer;
  }
  #actions button:hover{
    border-color:var(--accent);
    color:var(--accent);
  }
  #randomizeBtn{
    border-color:var(--accent);
    color:var(--accent);
  }
  #autoBtn.active{
    border-color:var(--danger);
    color:var(--danger);
  }
  .auto-group{
    display:flex;
    align-items:center;
    gap:8px;
    margin-left:auto;
  }
  #countdown{
    font-size:11px;
    color:var(--accent);
    letter-spacing:2px;
    min-width:70px;
    text-align:right;
  }
  .spacer{ flex:1 1 auto; }

  ::-webkit-scrollbar{ width:8px; height:8px; }
  ::-webkit-scrollbar-track{ background:var(--bg); }
  ::-webkit-scrollbar-thumb{ background:var(--border); }
</style>
</head>
<body>
  <div id="stage">
    <canvas id="glcanvas"></canvas>
    <div id="badges"></div>
    <div id="toolbar">
      <button id="recordBtn" title="Record canvas to .webm">RECORD</button>
      <button id="screenshotBtn" title="Save current frame as .png">SCREENSHOT</button>
    </div>
  </div>

  <div id="sources">
    <div class="source-slot" data-index="0"><span class="source-num">1</span><span class="source-label">DROP FILE</span></div>
    <div class="source-slot" data-index="1"><span class="source-num">2</span><span class="source-label">DROP FILE</span></div>
    <div class="source-slot" data-index="2"><span class="source-num">3</span><span class="source-label">DROP FILE</span></div>
    <div class="source-slot" data-index="3"><span class="source-num">4</span><span class="source-label">DROP FILE</span></div>
  </div>

  <div id="controls" class="expanded">
    <button id="panelToggle">CONTROLS ▾</button>
    <div id="panelBody">
      <div id="mixer">
        <div class="mixer-row">
          <span class="mixer-label">BUS A</span>
          <button class="mixer-btn" data-bus="A" data-src="0">1</button>
          <button class="mixer-btn" data-bus="A" data-src="1">2</button>
          <button class="mixer-btn" data-bus="A" data-src="2">3</button>
          <button class="mixer-btn" data-bus="A" data-src="3">4</button>
        </div>
        <div class="mixer-row">
          <span class="mixer-label">BUS B</span>
          <button class="mixer-btn" data-bus="B" data-src="0">1</button>
          <button class="mixer-btn" data-bus="B" data-src="1">2</button>
          <button class="mixer-btn" data-bus="B" data-src="2">3</button>
          <button class="mixer-btn" data-bus="B" data-src="3">4</button>
        </div>
        <div class="mixer-row">
          <span class="mixer-label">CROSSFADE</span>
          <span class="val">A</span>
          <input type="range" id="crossfade" min="0" max="100" value="0">
          <span class="val">B</span>
          <span class="val" id="crossfadeVal">0</span>
        </div>
      </div>
      <div id="effectsList"></div>
      <div id="actions">
        <button id="randomizeBtn">RANDOMIZE [SPACE]</button>
        <button id="clearBtn">CLEAR ALL [R]</button>
        <div class="auto-group">
          <button id="autoBtn">AUTO [A]</button>
          <select id="autoInterval">
            <option value="2">2S</option>
            <option value="5" selected>5S</option>
            <option value="10">10S</option>
            <option value="30">30S</option>
          </select>
          <span id="countdown">NEXT: --</span>
        </div>
      </div>
    </div>
  </div>

  <video class="src-video" data-index="0" loop muted playsinline style="display:none;"></video>
  <video class="src-video" data-index="1" loop muted playsinline style="display:none;"></video>
  <video class="src-video" data-index="2" loop muted playsinline style="display:none;"></video>
  <video class="src-video" data-index="3" loop muted playsinline style="display:none;"></video>

<script>
(function(){
  "use strict";

  // ---------------------------------------------------------------------
  // Effect definitions
  // ---------------------------------------------------------------------
  const EFFECTS = [
    { key:'glitch',       label:'Glitch',        uniform:'u_glitch' },
    { key:'rgbSplit',     label:'RGB Split',     uniform:'u_rgbSplit' },
    { key:'pixelate',     label:'Pixelate',      uniform:'u_pixelate' },
    { key:'invert',       label:'Invert',        uniform:'u_invert' },
    { key:'scanlines',    label:'Scanlines',     uniform:'u_scanlines' },
    { key:'kaleidoscope', label:'Kaleidoscope',  uniform:'u_kaleidoscope' },
    { key:'echo',         label:'Echo Trails',   uniform:'u_echo' },
    { key:'colorShift',   label:'Colour Shift',  uniform:'u_colorShift' },
    { key:'mirror',       label:'Mirror',        uniform:'u_mirror' },
    { key:'vignette',     label:'Vignette',      uniform:'u_vignette' },
    { key:'pixelSort',    label:'Pixel Sort',    uniform:'u_pixelSort' },
    { key:'decimate',     label:'Decimate',      uniform:'u_decimate' },
    { key:'lightStreak',  label:'Light Streak',  uniform:'u_lightStreak' },
    { key:'vhs',          label:'VHS',           uniform:'u_vhs' },
    { key:'grain',        label:'Film Grain',    uniform:'u_grain' },
    { key:'posterize',    label:'Posterize',     uniform:'u_posterize' },
    { key:'wave',         label:'Wave',          uniform:'u_wave' },
    { key:'strobe',       label:'Strobe',        uniform:'u_strobe' },
    { key:'threshold',    label:'Threshold',     uniform:'u_threshold' },
    { key:'zoomPulse',    label:'Zoom Pulse',    uniform:'u_zoomPulse' },
    { key:'duotone',      label:'Duotone',       uniform:'u_duotone' },
  ];

  const state = {};
  EFFECTS.forEach(e => { state[e.key] = { enabled:false, intensity:50 }; });
  // Duotone highlight colour defaults to the app accent tan
  state.duotone = { enabled:false, intensity:100, r:200, g:184, b:154 };

  // ---------------------------------------------------------------------
  // DOM refs
  // ---------------------------------------------------------------------
  const canvas = document.getElementById('glcanvas');
  const stage = document.getElementById('stage');
  const badges = document.getElementById('badges');
  const effectsList = document.getElementById('effectsList');
  const controlsPanel = document.getElementById('controls');
  const panelToggle = document.getElementById('panelToggle');
  const randomizeBtn = document.getElementById('randomizeBtn');
  const clearBtn = document.getElementById('clearBtn');
  const autoBtn = document.getElementById('autoBtn');
  const autoInterval = document.getElementById('autoInterval');
  const countdownEl = document.getElementById('countdown');
  const recordBtn = document.getElementById('recordBtn');
  const screenshotBtn = document.getElementById('screenshotBtn');

  // ---------------------------------------------------------------------
  // Build effect controls UI
  // ---------------------------------------------------------------------
  EFFECTS.forEach(eff => {
    const row = document.createElement('div');
    row.className = 'effect-row';
    row.dataset.key = eff.key;

    const label = document.createElement('label');
    label.className = 'toggle';
    const checkbox = document.createElement('input');
    checkbox.type = 'checkbox';
    label.appendChild(checkbox);
    label.appendChild(document.createTextNode(eff.label));

    const slider = document.createElement('input');
    slider.type = 'range';
    slider.min = '0';
    slider.max = '100';
    slider.value = String(state[eff.key].intensity);

    const val = document.createElement('span');
    val.className = 'val';
    val.textContent = state[eff.key].intensity;

    checkbox.addEventListener('change', () => {
      state[eff.key].enabled = checkbox.checked;
      updateBadges();
    });
    slider.addEventListener('input', () => {
      state[eff.key].intensity = parseInt(slider.value, 10);
      val.textContent = slider.value;
      updateBadges();
    });

    row.appendChild(label);
    row.appendChild(slider);
    row.appendChild(val);
    effectsList.appendChild(row);

    eff._dom = { checkbox, slider, val };

    // Duotone: RGB sliders for highlight colour
    if (eff.key === 'duotone') {
      const sub = document.createElement('div');
      sub.className = 'effect-sub';
      const channels = [['R', 'r'], ['G', 'g'], ['B', 'b']];
      const swatchEl = document.createElement('div');
      swatchEl.className = 'duo-swatch';

      function updateSwatch(){
        const d = state.duotone;
        swatchEl.style.background = 'rgb('+d.r+','+d.g+','+d.b+')';
      }

      channels.forEach(([lbl, ch]) => {
        const lEl = document.createElement('span');
        lEl.className = 'ch-label';
        lEl.textContent = lbl;

        const sl = document.createElement('input');
        sl.type = 'range';
        sl.min = '0'; sl.max = '255';
        sl.value = String(state.duotone[ch]);

        const v = document.createElement('span');
        v.className = 'val';
        v.textContent = state.duotone[ch];

        sl.addEventListener('input', () => {
          state.duotone[ch] = parseInt(sl.value, 10);
          v.textContent = sl.value;
          updateSwatch();
        });

        sub.appendChild(lEl);
        sub.appendChild(sl);
        sub.appendChild(v);
      });

      sub.appendChild(swatchEl);
      updateSwatch();
      effectsList.appendChild(sub);
    }
  });

  function syncUIFromState(){
    EFFECTS.forEach(eff => {
      eff._dom.checkbox.checked = state[eff.key].enabled;
      eff._dom.slider.value = String(state[eff.key].intensity);
      eff._dom.val.textContent = state[eff.key].intensity;
    });
    updateBadges();
  }

  function updateBadges(){
    badges.innerHTML = '';
    EFFECTS.forEach(eff => {
      if (state[eff.key].enabled && state[eff.key].intensity > 0) {
        const b = document.createElement('div');
        b.className = 'badge';
        b.textContent = eff.label + ' ' + state[eff.key].intensity;
        badges.appendChild(b);
      }
    });
  }

  // ---------------------------------------------------------------------
  // Panel collapse
  // ---------------------------------------------------------------------
  panelToggle.addEventListener('click', () => {
    controlsPanel.classList.toggle('collapsed');
    const collapsed = controlsPanel.classList.contains('collapsed');
    panelToggle.textContent = collapsed ? 'CONTROLS ▴' : 'CONTROLS ▾';
  });

  // ---------------------------------------------------------------------
  // Randomize / clear
  // ---------------------------------------------------------------------
  function randomize(){
    EFFECTS.forEach(eff => { state[eff.key].enabled = false; });
    const count = 2 + Math.floor(Math.random() * 3); // 2-4
    const pool = EFFECTS.slice();
    for (let i = pool.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [pool[i], pool[j]] = [pool[j], pool[i]];
    }
    pool.slice(0, count).forEach(eff => {
      state[eff.key].enabled = true;
      state[eff.key].intensity = 20 + Math.floor(Math.random() * 81); // 20-100
    });
    syncUIFromState();
  }

  function clearAll(){
    EFFECTS.forEach(eff => { state[eff.key].enabled = false; });
    syncUIFromState();
  }

  randomizeBtn.addEventListener('click', randomize);
  clearBtn.addEventListener('click', clearAll);

  // ---------------------------------------------------------------------
  // Auto-randomize
  // ---------------------------------------------------------------------
  let autoActive = false;
  let autoSeconds = parseInt(autoInterval.value, 10);
  let countdown = autoSeconds;
  let autoTimer = null;

  function tickCountdown(){
    countdown -= 1;
    if (countdown <= 0) {
      randomize();
      countdown = autoSeconds;
    }
    countdownEl.textContent = 'NEXT: ' + countdown + 'S';
  }

  function setAuto(on){
    autoActive = on;
    autoBtn.classList.toggle('active', autoActive);
    if (autoTimer) { clearInterval(autoTimer); autoTimer = null; }
    if (autoActive) {
      autoSeconds = parseInt(autoInterval.value, 10);
      countdown = autoSeconds;
      countdownEl.textContent = 'NEXT: ' + countdown + 'S';
      autoTimer = setInterval(tickCountdown, 1000);
    } else {
      countdownEl.textContent = 'NEXT: --';
    }
  }

  autoBtn.addEventListener('click', () => setAuto(!autoActive));
  autoInterval.addEventListener('change', () => {
    autoSeconds = parseInt(autoInterval.value, 10);
    countdown = autoSeconds;
    if (autoActive) countdownEl.textContent = 'NEXT: ' + countdown + 'S';
  });

  // ---------------------------------------------------------------------
  // Keyboard shortcuts
  // ---------------------------------------------------------------------
  document.addEventListener('keydown', (e) => {
    const tag = (document.activeElement && document.activeElement.tagName) || '';
    if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') return;

    if (e.code === 'Space') {
      e.preventDefault();
      randomize();
    } else if (e.key === 'r' || e.key === 'R') {
      clearAll();
    } else if (e.key === 'a' || e.key === 'A') {
      setAuto(!autoActive);
    }
  });

  // ---------------------------------------------------------------------
  // Video sources (4 drop zones) + mixer
  // ---------------------------------------------------------------------
  const SOURCE_COUNT = 4;
  const sources = [];
  for (let i = 0; i < SOURCE_COUNT; i++) {
    const videoEl = document.querySelector('.src-video[data-index="' + i + '"]');
    const slot = document.querySelector('.source-slot[data-index="' + i + '"]');
    const labelEl = slot.querySelector('.source-label');
    const src = { video: videoEl, slot, labelEl, loaded:false, texture:null };
    sources.push(src);

    ['dragenter','dragover'].forEach(evt => {
      slot.addEventListener(evt, (e) => {
        e.preventDefault();
        slot.classList.add('dragover');
      });
    });
    ['dragleave'].forEach(evt => {
      slot.addEventListener(evt, (e) => {
        e.preventDefault();
        slot.classList.remove('dragover');
      });
    });
    slot.addEventListener('drop', (e) => {
      e.preventDefault();
      slot.classList.remove('dragover');
      const file = e.dataTransfer.files && e.dataTransfer.files[0];
      if (!file || !file.type.startsWith('video/')) return;
      const url = URL.createObjectURL(file);
      videoEl.src = url;
      videoEl.play().catch(()=>{});
      labelEl.textContent = file.name;
      slot.classList.add('loaded');
    });
    videoEl.addEventListener('loadeddata', () => {
      src.loaded = true;
    });
  }

  // Mixer state: two buses (A/B) each fed by one of the 4 sources, blended by crossfade
  let busA = 0;
  let busB = 1;
  let crossfade = 0; // 0 = full A, 100 = full B

  const crossfadeSlider = document.getElementById('crossfade');
  const crossfadeVal = document.getElementById('crossfadeVal');
  const mixerBtns = document.querySelectorAll('.mixer-btn');

  function updateMixerUI(){
    mixerBtns.forEach(btn => {
      const bus = btn.dataset.bus;
      const idx = parseInt(btn.dataset.src, 10);
      const active = (bus === 'A' ? busA : busB) === idx;
      btn.classList.toggle('active', active);
    });
  }

  mixerBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      const idx = parseInt(btn.dataset.src, 10);
      if (btn.dataset.bus === 'A') busA = idx; else busB = idx;
      updateMixerUI();
    });
  });

  crossfadeSlider.addEventListener('input', () => {
    crossfade = parseInt(crossfadeSlider.value, 10);
    crossfadeVal.textContent = crossfade;
  });

  updateMixerUI();

  // ---------------------------------------------------------------------
  // WebGL setup
  // ---------------------------------------------------------------------
  const gl = canvas.getContext('webgl', { preserveDrawingBuffer:true, antialias:false })
          || canvas.getContext('experimental-webgl', { preserveDrawingBuffer:true, antialias:false });

  if (!gl) {
    alert('WebGL is not supported in this browser.');
    return;
  }

  const VERT_SRC = `
    attribute vec2 a_pos;
    void main(){
      gl_Position = vec4(a_pos, 0.0, 1.0);
    }
  `;

  const FRAG_SRC = `
    precision mediump float;

    uniform sampler2D u_videoA;
    uniform sampler2D u_videoB;
    uniform sampler2D u_prev;
    uniform vec2 u_resolution;
    uniform vec2 u_videoSize;
    uniform float u_time;
    uniform float u_hasVideo;
    uniform float u_mix;

    uniform float u_glitch;
    uniform float u_rgbSplit;
    uniform float u_pixelate;
    uniform float u_invert;
    uniform float u_scanlines;
    uniform float u_kaleidoscope;
    uniform float u_echo;
    uniform float u_colorShift;
    uniform float u_mirror;
    uniform float u_vignette;
    uniform float u_pixelSort;
    uniform float u_decimate;
    uniform float u_lightStreak;
    uniform float u_vhs;
    uniform float u_grain;
    uniform float u_posterize;
    uniform float u_wave;
    uniform float u_strobe;
    uniform float u_threshold;
    uniform float u_zoomPulse;
    uniform float u_duotone;
    uniform float u_duoR;
    uniform float u_duoG;
    uniform float u_duoB;

    const vec3 BG = vec3(0.0509, 0.0509, 0.0431);

    float rand(vec2 co){
      return fract(sin(dot(co, vec2(12.9898, 78.233))) * 43758.5453123);
    }

    vec3 rgb2hsv(vec3 c){
      vec4 K = vec4(0.0, -1.0/3.0, 2.0/3.0, -1.0);
      vec4 p = mix(vec4(c.bg, K.wz), vec4(c.gb, K.xy), step(c.b, c.g));
      vec4 q = mix(vec4(p.xyw, c.r), vec4(c.r, p.yzx), step(p.x, c.r));
      float d = q.x - min(q.w, q.y);
      float e = 1.0e-10;
      return vec3(abs(q.z + (q.w - q.y) / (6.0 * d + e)), d / (q.x + e), q.x);
    }
    vec3 hsv2rgb(vec3 c){
      vec4 K = vec4(1.0, 2.0/3.0, 1.0/3.0, 3.0);
      vec3 p = abs(fract(c.xxx + K.xyz) * 6.0 - K.www);
      return c.z * mix(K.xxx, clamp(p - K.xxx, 0.0, 1.0), c.y);
    }

    vec3 sampleMix(vec2 uv){
      return mix(texture2D(u_videoA, uv).rgb, texture2D(u_videoB, uv).rgb, u_mix);
    }

    void main(){
      vec2 uv = gl_FragCoord.xy / u_resolution;
      vec2 c = uv - 0.5;
      vec2 vc = c;

      // Kaleidoscope: radial mirror segments
      if (u_kaleidoscope > 0.0) {
        float segments = floor(mix(2.0, 16.0, u_kaleidoscope));
        float angle = atan(c.y, c.x);
        float radius = length(c);
        float seg = 6.28318530718 / segments;
        angle = mod(angle, seg);
        angle = abs(angle - seg * 0.5);
        c = vec2(cos(angle), sin(angle)) * radius;
      }

      // Mirror: progressive horizontal fold
      c.x = mix(c.x, abs(c.x), u_mirror);

      vec3 color;

      if (u_hasVideo < 0.5) {
        color = BG;
      } else {
        float canvasAspect = u_resolution.x / u_resolution.y;
        float videoAspect = u_videoSize.x / u_videoSize.y;
        vec2 scale;
        if (canvasAspect > videoAspect) {
          scale = vec2(videoAspect / canvasAspect, 1.0);
        } else {
          scale = vec2(1.0, canvasAspect / videoAspect);
        }
        vec2 videoUV = c / scale + 0.5;

        bool outside = videoUV.x < 0.0 || videoUV.x > 1.0 || videoUV.y < 0.0 || videoUV.y > 1.0;

        if (outside) {
          color = BG;
        } else {
          // Pixelate
          if (u_pixelate > 0.0) {
            float grid = mix(600.0, 12.0, u_pixelate);
            videoUV = floor(videoUV * grid) / grid;
          }

          // Decimate: spatial sample-and-hold (reduces horizontal sample rate)
          if (u_decimate > 0.0) {
            float samples = mix(800.0, 20.0, u_decimate);
            videoUV.x = floor(videoUV.x * samples) / samples;
          }

          // Wave / ripple distortion
          if (u_wave > 0.0) {
            float amp = u_wave * 0.04;
            videoUV.x += sin(videoUV.y * 18.0 + u_time * 2.5) * amp;
            videoUV.y += cos(videoUV.x * 18.0 + u_time * 2.0) * amp * 0.5;
          }

          // Glitch: random horizontal slice offsets
          if (u_glitch > 0.0) {
            float slices = 30.0;
            float sliceY = floor(videoUV.y * slices);
            float frame = floor(u_time * 12.0);
            float trigger = rand(vec2(sliceY, frame));
            float shiftAmt = (rand(vec2(sliceY * 7.0, frame)) - 0.5) * u_glitch * 0.6;
            float threshold = mix(0.97, 0.5, u_glitch);
            videoUV.x += shiftAmt * step(threshold, trigger);
          }

          // VHS: horizontal tracking jitter per scanline
          if (u_vhs > 0.0) {
            float lineNoise = rand(vec2(floor(videoUV.y * 250.0), floor(u_time * 30.0)));
            videoUV.x += (lineNoise - 0.5) * u_vhs * 0.02;
          }

          vec2 cu = clamp(videoUV, 0.0, 1.0);

          // RGB split (VHS adds a touch of chroma bleed too)
          float off = u_rgbSplit * 0.04 + u_vhs * 0.01;
          vec2 cuR = clamp(videoUV + vec2(off, 0.0), 0.0, 1.0);
          vec2 cuB = clamp(videoUV - vec2(off, 0.0), 0.0, 1.0);

          float r = sampleMix(cuR).r;
          float g = sampleMix(cu).g;
          float b = sampleMix(cuB).b;
          color = vec3(r, g, b);

          // Pixel sort: smear each pixel toward the brightest one in a window
          if (u_pixelSort > 0.0) {
            float windowSize = u_pixelSort * 0.06;
            vec3 best = color;
            float bestLum = dot(color, vec3(0.299, 0.587, 0.114));
            for (int i = 1; i <= 12; i++) {
              float t = float(i) / 12.0;
              vec2 sp = clamp(vec2(videoUV.x + windowSize * t, videoUV.y), 0.0, 1.0);
              vec3 s = sampleMix(sp);
              float lum = dot(s, vec3(0.299, 0.587, 0.114));
              if (lum > bestLum) {
                bestLum = lum;
                best = s;
              }
            }
            color = mix(color, best, u_pixelSort);
          }

          // Colour shift (hue rotation)
          if (u_colorShift > 0.0) {
            vec3 hsv = rgb2hsv(color);
            hsv.x = fract(hsv.x + u_colorShift);
            color = hsv2rgb(hsv);
          }

          // Invert
          color = mix(color, 1.0 - color, u_invert);

          // Duotone: map luminance to shadow/highlight colours
          if (u_duotone > 0.0) {
            float lum = dot(color, vec3(0.299, 0.587, 0.114));
            vec3 shadowCol = vec3(0.051, 0.051, 0.043);
            vec3 highlightCol = vec3(u_duoR, u_duoG, u_duoB);
            vec3 duo = mix(shadowCol, highlightCol, lum);
            color = mix(color, duo, u_duotone);
          }

          // Posterize: quantize colour into flat bands
          if (u_posterize > 0.0) {
            float levels = mix(64.0, 2.0, u_posterize);
            color = floor(color * levels + 0.5) / levels;
          }

          // Threshold: hard black/white cutoff
          if (u_threshold > 0.0) {
            float lum = dot(color, vec3(0.299, 0.587, 0.114));
            vec3 bw = vec3(step(0.5, lum));
            color = mix(color, bw, u_threshold);
          }

          // Film grain
          if (u_grain > 0.0) {
            float n = rand(uv * u_resolution + fract(u_time) * 1000.0);
            color += (n - 0.5) * u_grain * 0.5;
          }

          // VHS noise + slight colour tint
          if (u_vhs > 0.0) {
            float n2 = rand(uv * u_resolution + u_time * 120.0);
            color += (n2 - 0.5) * u_vhs * 0.12;
            color = mix(color, color * vec3(1.05, 0.97, 1.02), u_vhs);
          }

          // Scanlines
          float linePattern = step(2.0, mod(gl_FragCoord.y, 4.0));
          float lineFactor = mix(1.0, 0.35, linePattern);
          color *= mix(1.0, lineFactor, u_scanlines);

          // Vignette
          float vig = smoothstep(0.75, 0.15, length(vc));
          color *= mix(1.0, vig, u_vignette);
        }
      }

      // Strobe: periodic flash to black
      if (u_strobe > 0.0) {
        float freq = mix(2.0, 16.0, u_strobe);
        float flash = step(0.5, fract(u_time * freq));
        color *= mix(1.0, flash, u_strobe);
      }

      // Light streak: smeared trail of bright highlights
      if (u_lightStreak > 0.0) {
        vec2 streakUV = clamp(uv - vec2(u_lightStreak * 0.015, 0.0), 0.0, 1.0);
        vec3 prevS = texture2D(u_prev, streakUV).rgb;
        float lum = dot(prevS, vec3(0.299, 0.587, 0.114));
        vec3 streak = prevS * step(0.55, lum);
        color += streak * u_lightStreak * 0.9;
      }

      // Zoom pulse: feedback frame zoomed toward centre
      if (u_zoomPulse > 0.0) {
        float zoomAmt = 1.0 - u_zoomPulse * 0.04;
        vec2 zUV = clamp((uv - 0.5) * zoomAmt + 0.5, 0.0, 1.0);
        vec3 prevZ = texture2D(u_prev, zUV).rgb;
        color = mix(color, prevZ, u_zoomPulse * 0.8);
      }

      // Echo trails: blend with previous rendered frame
      if (u_echo > 0.0) {
        vec3 prevColor = texture2D(u_prev, uv).rgb;
        color = mix(color, prevColor, u_echo * 0.92);
      }

      gl_FragColor = vec4(color, 1.0);
    }
  `;

  function compileShader(type, src){
    const shader = gl.createShader(type);
    gl.shaderSource(shader, src);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      console.error(gl.getShaderInfoLog(shader));
      throw new Error('Shader compile error');
    }
    return shader;
  }

  const program = gl.createProgram();
  gl.attachShader(program, compileShader(gl.VERTEX_SHADER, VERT_SRC));
  gl.attachShader(program, compileShader(gl.FRAGMENT_SHADER, FRAG_SRC));
  gl.linkProgram(program);
  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error(gl.getProgramInfoLog(program));
    throw new Error('Program link error');
  }
  gl.useProgram(program);

  // Full-screen quad
  const quadBuffer = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, quadBuffer);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
    -1, -1,   1, -1,   -1, 1,   1, 1
  ]), gl.STATIC_DRAW);
  const posLoc = gl.getAttribLocation(program, 'a_pos');
  gl.enableVertexAttribArray(posLoc);
  gl.vertexAttribPointer(posLoc, 2, gl.FLOAT, false, 0, 0);

  // Uniform locations
  const uniforms = {};
  ['u_videoA','u_videoB','u_prev','u_resolution','u_videoSize','u_time','u_hasVideo','u_mix','u_duoR','u_duoG','u_duoB'].forEach(n => {
    uniforms[n] = gl.getUniformLocation(program, n);
  });
  EFFECTS.forEach(eff => {
    uniforms[eff.uniform] = gl.getUniformLocation(program, eff.uniform);
  });

  // One texture per video source
  sources.forEach(src => {
    const tex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    // Placeholder 1x1 pixel
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array([0,0,0,255]));
    src.texture = tex;
  });

  // Ping-pong framebuffers for echo feedback
  function createFBO(w, h){
    const tex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
    const fb = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    return { fb, tex, w, h };
  }

  function destroyFBO(fbo){
    if (!fbo) return;
    gl.deleteFramebuffer(fbo.fb);
    gl.deleteTexture(fbo.tex);
  }

  let fboRead = null, fboWrite = null;

  function resize(){
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = Math.max(1, Math.floor(stage.clientWidth * dpr));
    const h = Math.max(1, Math.floor(stage.clientHeight * dpr));
    if (canvas.width === w && canvas.height === h) return;
    canvas.width = w;
    canvas.height = h;
    destroyFBO(fboRead);
    destroyFBO(fboWrite);
    fboRead = createFBO(w, h);
    fboWrite = createFBO(w, h);
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------------------------------------------------------------------
  // Render loop
  // ---------------------------------------------------------------------
  const startTime = performance.now();

  function setUniforms(prevTex){
    const srcA = sources[busA];
    const srcB = sources[busB];

    let mixVal = crossfade / 100;
    if (!srcA.loaded && srcB.loaded) mixVal = 1;
    else if (srcA.loaded && !srcB.loaded) mixVal = 0;
    const hasVideo = srcA.loaded || srcB.loaded;

    let vw = 1, vh = 1;
    if (srcA.loaded) { vw = srcA.video.videoWidth; vh = srcA.video.videoHeight; }
    else if (srcB.loaded) { vw = srcB.video.videoWidth; vh = srcB.video.videoHeight; }

    gl.uniform2f(uniforms.u_resolution, canvas.width, canvas.height);
    gl.uniform2f(uniforms.u_videoSize, vw, vh);
    gl.uniform1f(uniforms.u_time, (performance.now() - startTime) / 1000);
    gl.uniform1f(uniforms.u_hasVideo, hasVideo ? 1.0 : 0.0);
    gl.uniform1f(uniforms.u_mix, mixVal);
    gl.uniform1f(uniforms.u_duoR, state.duotone.r / 255);
    gl.uniform1f(uniforms.u_duoG, state.duotone.g / 255);
    gl.uniform1f(uniforms.u_duoB, state.duotone.b / 255);

    EFFECTS.forEach(eff => {
      const s = state[eff.key];
      const value = s.enabled ? s.intensity / 100 : 0;
      gl.uniform1f(uniforms[eff.uniform], value);
    });

    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, srcA.texture);
    gl.uniform1i(uniforms.u_videoA, 0);

    gl.activeTexture(gl.TEXTURE1);
    gl.bindTexture(gl.TEXTURE_2D, srcB.texture);
    gl.uniform1i(uniforms.u_videoB, 1);

    gl.activeTexture(gl.TEXTURE2);
    gl.bindTexture(gl.TEXTURE_2D, prevTex);
    gl.uniform1i(uniforms.u_prev, 2);
  }

  function drawPass(targetFB, prevTex){
    gl.bindFramebuffer(gl.FRAMEBUFFER, targetFB);
    gl.viewport(0, 0, canvas.width, canvas.height);
    setUniforms(prevTex);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  }

  let frameCount = 0;

  function render(){
    requestAnimationFrame(render);
    frameCount++;

    // Decimate: hold the video frame for several ticks to simulate a lower frame rate
    const decimate = state.decimate;
    const holdFrames = decimate.enabled ? 1 + Math.round((decimate.intensity / 100) * 20) : 1;
    const shouldUpdateVideo = (frameCount % holdFrames) === 0;

    if (shouldUpdateVideo) {
      sources.forEach(src => {
        if (src.loaded && src.video.readyState >= 2 && !src.video.paused) {
          gl.activeTexture(gl.TEXTURE0);
          gl.bindTexture(gl.TEXTURE_2D, src.texture);
          gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
          try {
            gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, src.video);
          } catch (e) { /* ignore transient decode errors */ }
        }
      });
    }

    gl.useProgram(program);
    gl.bindBuffer(gl.ARRAY_BUFFER, quadBuffer);
    gl.vertexAttribPointer(posLoc, 2, gl.FLOAT, false, 0, 0);

    // Pass 1: render into write FBO (becomes "previous frame" for next tick)
    drawPass(fboWrite.fb, fboRead.tex);
    // Pass 2: render to canvas
    drawPass(null, fboRead.tex);

    // Swap ping-pong buffers
    const tmp = fboRead;
    fboRead = fboWrite;
    fboWrite = tmp;
  }
  requestAnimationFrame(render);

  // ---------------------------------------------------------------------
  // Recording
  // ---------------------------------------------------------------------
  let mediaRecorder = null;
  let recordedChunks = [];
  let recording = false;
  let recordStart = 0;
  let recordTimerHandle = null;

  function formatDuration(ms){
    const totalSec = Math.floor(ms / 1000);
    const m = Math.floor(totalSec / 60);
    const s = totalSec % 60;
    return String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
  }

  function updateRecordLabel(){
    const elapsed = Date.now() - recordStart;
    recordBtn.innerHTML = '<span class="rec-dot"></span> STOP &middot; ' + formatDuration(elapsed);
  }

  function startRecording(){
    let stream;
    try {
      stream = canvas.captureStream(30);
    } catch (e) {
      alert('Canvas recording is not supported in this browser.');
      return;
    }
    const candidates = [
      'video/webm;codecs=vp9',
      'video/webm',
    ];
    let mimeType = candidates.find(t => MediaRecorder.isTypeSupported(t)) || '';
    const ext = 'webm';

    recordedChunks = [];
    mediaRecorder = new MediaRecorder(stream, mimeType ? { mimeType } : undefined);
    mediaRecorder.ondataavailable = (e) => {
      if (e.data && e.data.size > 0) recordedChunks.push(e.data);
    };
    mediaRecorder.onstop = () => {
      const blob = new Blob(recordedChunks, { type: mediaRecorder.mimeType || mimeType || 'video/webm' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'vj-export-' + Date.now() + '.' + ext;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    };

    mediaRecorder.start();
    recording = true;
    recordStart = Date.now();
    recordBtn.classList.add('active');
    updateRecordLabel();
    recordTimerHandle = setInterval(updateRecordLabel, 500);
  }

  function stopRecording(){
    if (mediaRecorder && recording) {
      mediaRecorder.stop();
    }
    recording = false;
    recordBtn.classList.remove('active');
    recordBtn.textContent = 'RECORD';
    if (recordTimerHandle) { clearInterval(recordTimerHandle); recordTimerHandle = null; }
  }

  recordBtn.addEventListener('click', () => {
    if (recording) stopRecording();
    else startRecording();
  });

  // ---------------------------------------------------------------------
  // Screenshot
  // ---------------------------------------------------------------------
  screenshotBtn.addEventListener('click', () => {
    canvas.toBlob((blob) => {
      if (!blob) return;
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'vj-frame-' + Date.now() + '.png';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }, 'image/png');
  });

  // Initial state
  recordBtn.textContent = 'RECORD';
  syncUIFromState();
})();
</script>
</body>
